services:
  - type: web
    name: stock-analysis-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://stocks.carfagnoenterprises.com
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /healthz
    domains:
      - api.stocks.carfagnoenterprises.com
