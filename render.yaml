services:
  - type: web
    name: stock-analysis-api
    env: python
    buildCommand: |
      python -m venv .venv
      . .venv/bin/activate
      pip install -r requirements.txt
    startCommand: |
      . .venv/bin/activate
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://ai-stock-app-vh2t163w.devinapps.com
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /healthz
